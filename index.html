<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f6f8f5">
	<meta name="description" content="Uma página inicial para o seu projeto.">
	<title>Caramelo | Início</title>
	<style>
		:root {
			color-scheme: light;
			--background: #f6f8f5;
			--surface: #ffffff;
			--text: #1c2925;
			--muted: #61716a;
			--accent: #176b57;
			--accent-hover: #105542;
			--border: #dce5df;
			font-family: "Segoe UI", sans-serif;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			color: var(--text);
			background-color: var(--background);
			background-image: radial-gradient(#dce5df 0.7px, transparent 0.7px);
			background-size: 18px 18px;
		}

		a {
			color: inherit;
			text-decoration: none;
		}

		.page {
			display: flex;
			min-height: 100vh;
			flex-direction: column;
		}

		.header {
			width: min(100% - 40px, 1080px);
			min-height: 76px;
			margin-inline: auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 24px;
			border-bottom: 1px solid var(--border);
		}

		.brand {
			font-family: Georgia, serif;
			font-size: 1.35rem;
			font-weight: 700;
		}

		.navigation {
			display: flex;
			flex-wrap: wrap;
			gap: 24px;
			color: var(--muted);
			font-size: 0.95rem;
		}

		.navigation a:hover,
		.navigation a:focus-visible {
			color: var(--accent);
		}

		main {
			width: min(100% - 40px, 1080px);
			flex: 1;
			margin: 0 auto;
			display: grid;
			place-items: center;
			padding-block: 72px;
		}

		.intro {
			width: min(100%, 680px);
			padding: clamp(28px, 7vw, 64px);
			border: 1px solid var(--border);
			border-radius: 8px;
			background: var(--surface);
			box-shadow: 0 16px 48px rgb(28 41 37 / 6%);
			text-align: center;
		}

		.eyebrow {
			margin: 0 0 16px;
			color: var(--accent);
			font-size: 0.78rem;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-family: Georgia, serif;
			font-size: clamp(2.25rem, 7vw, 4rem);
			font-weight: 500;
			line-height: 1.08;
		}

		.description {
			max-width: 44ch;
			margin: 20px auto 28px;
			color: var(--muted);
			font-size: 1.05rem;
			line-height: 1.7;
		}

		.button {
			min-height: 46px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			padding: 0 20px;
			border: 0;
			border-radius: 5px;
			color: #ffffff;
			background: var(--accent);
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}

		.button:hover,
		.button:focus-visible {
			background: var(--accent-hover);
		}

		.footer {
			width: min(100% - 40px, 1080px);
			margin-inline: auto;
			padding: 22px 0;
			border-top: 1px solid var(--border);
			color: var(--muted);
			font-size: 0.875rem;
			text-align: center;
		}

		@media (max-width: 520px) {
			.header {
				min-height: 68px;
				gap: 16px;
			}

			.navigation {
				gap: 14px;
				font-size: 0.875rem;
			}

			main {
				padding-block: 40px;
			}
		}
	</style>
</head>
<body>
	<div class="page">
		<header class="header">
			<a class="brand" href="#inicio" aria-label="Caramelo, início">Caramelo</a>
			<nav class="navigation" aria-label="Navegação principal">
				<a href="#inicio">Início</a>
				<a href="#contato">Contato</a>
			</nav>
		</header>

		<main id="inicio">
			<section class="intro" aria-labelledby="page-title">
				<p class="eyebrow">Um espaço para sua ideia</p>
				<h1 id="page-title">Sua página começa aqui.</h1>
				<p class="description">Troque este texto pelo conteúdo do seu projeto e personalize os links para sua necessidade.</p>
				<a class="button" href="#contato">Saiba mais</a>
			</section>
		</main>

		<footer class="footer" id="contato">
			<p>&copy; 2026 Caramelo</p>
		</footer>
	</div>
</body>
</html>
